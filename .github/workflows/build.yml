name: build-frida-server
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential ccache
          pip3 install meson ninja

      - name: Clone frida 17.24.3
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch 17.24.3 --recurse-submodules --shallow-submodules -j4 https://github.com/frida/frida.git

      - name: Patch anti-detection strings
        run: |
          cd frida
          X() { grep -rl --exclude-dir=.git "$1" . 2>/dev/null | xargs -r sed -i "s@$1@$2@g"; }
          X "gum-js-loop" "gxm-js-loop"
          X "pool-frida" "pool-fnida"
          X "frida-agent" "fnida-agent"
          X "frida-helper" "fnida-helper"
          X "frida-server" "fnida-server"
          X "frida-compiler" "fnida-compiler"
          X "frida-gadget" "fnida-gadget"
          X "re\.frida\." "re.fnida."
          X "re/frida/" "re/fnida/"
          X "package re.frida" "package re.fnida"
          X "get_frida_agent" "get_fnida_agent"
          X "get_frida_helper" "get_fnida_helper"
          X "get_frida_gadget" "get_fnida_gadget"
          X "get_frida_compiler" "get_fnida_compiler"
          X '"gmain"' '"gmxin"'
          X '"gdbus"' '"gdbxs"'
          for PAT in frida-agent frida-helper frida-server frida-compiler frida-gadget; do
            while IFS= read -r -d '' f; do
              d=$(dirname "$f"); b=$(basename "$f")
              nb=${b//$PAT/${PAT/frida/fnida}}
              [ "$b" != "$nb" ] && mv "$f" "$d/$nb"
            done < <(find . -path ./.git -prune -o -name "*$PAT*" -print0 2>/dev/null)
          done
          cat > /tmp/patch_dex.py << 'PYEOF2'
          import sys, pathlib, zlib, hashlib
          for p in sys.argv[1:]:
              f = pathlib.Path(p)
              raw = f.read_bytes()
              b = bytearray(raw.replace(b're/frida/', b're/fnida/').replace(b're.frida', b're.fnida'))
              if len(b) >= 32 and bytes(b[:4]) == b'dex\n':
                  b[12:32] = hashlib.sha1(bytes(b[32:])).digest()
                  b[8:12] = (zlib.adler32(bytes(b[12:])) & 0xFFFFFFFF).to_bytes(4, 'little')
                  f.write_bytes(bytes(b))
                  print('dex patched+checksum fixed:', p)
              else:
                  print('skip non-dex:', p)
          PYEOF2
          find . -name "*.dex" -type f | xargs -r python3 /tmp/patch_dex.py

      - name: Install Android NDK r29
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build frida-server android-arm64
        run: |
          cd frida
          ./configure --host=android-arm64
          make -j$(nproc) 2>&1 | tail -30

      - name: Collect binary
        run: |
          B=$(find frida/build/subprojects/frida-core/server -maxdepth 1 -name "fnida-server" -type f | head -1)
          [ -z "$B" ] && B=$(find frida/build -path "*node_modules*" -prune -o -name "fnida-server" -type f -print | head -1)
          echo "found: $B"
          file "$B"
          cp "$B" ./fnida-server-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: frida-server-patched-arm64
          path: ./fnida-server-arm64
          if-no-files-found: error
